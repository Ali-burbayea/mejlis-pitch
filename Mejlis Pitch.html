<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Mejlis Pitch · حجز الملاعب</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="frames/ios-frame.jsx"></script>
  <script type="text/babel" src="frames/android-frame.jsx"></script>
  <script type="text/babel" src="components/Atoms.jsx"></script>
  <script type="text/babel" src="components/Screens.jsx"></script>
  <script type="text/babel">
    const { useState } = React;

    const SCREENS = [
      ['home', 'الرئيسية'],
      ['list', 'الملاعب'],
      ['detail', 'تفاصيل'],
      ['slots', 'الفترات'],
      ['confirm', 'تأكيد'],
      ['public', 'لعبات عامة'],
    ];

    function loadStateFromHash() {
      try {
        const raw = window.location.hash.replace(/^#/, '');
        if (!raw) return null;
        return JSON.parse(decodeURIComponent(raw));
      } catch { return null; }
    }

    function App() {
      const persisted = loadStateFromHash();
      const [screen, setScreen] = useState(persisted?.screen || 'home');
      const [state, setState] = useState(persisted?.state || {
        sport: 'football',
        fieldId: null,
        slots: [],
        teamSize: null,
        total: 0,
      });

      // persist current screen so refresh restores
      React.useEffect(() => {
        const payload = encodeURIComponent(JSON.stringify({ screen, state }));
        window.location.hash = payload;
      }, [screen, state]);

      const go = s => setScreen(s);

      const renderScreen = () => {
        const props = { go, state, setState };
        switch (screen) {
          case 'home':    return <HomeScreen {...props} />;
          case 'list':    return <ListScreen {...props} />;
          case 'detail':  return <DetailScreen {...props} />;
          case 'slots':   return <SlotsScreen {...props} />;
          case 'confirm': return <ConfirmScreen {...props} />;
          case 'public':  return <PublicScreen {...props} />;
          default: return <HomeScreen {...props} />;
        }
      };

      return (
        <div>
          <div className="title-bar">
            <h1>Mejlis Pitch · حجز الملاعب</h1>
            <p>Football & volleyball booking · Kuwait City · RTL prototype</p>
          </div>
          <div className="nav">
            {SCREENS.map(([k, l]) => (
              <button key={k} onClick={() => go(k)} className={screen === k ? 'active' : ''}>{l}</button>
            ))}
          </div>
          <div className="stage">
            <div className="col">
              <div className="col-label">iOS</div>
              <IOSDevice dark={true}>
                <div data-screen-label={screen} className="ios-inset" style={{ height: '100%' }}>
                  {renderScreen()}
                </div>
              </IOSDevice>
            </div>
            <div className="col">
              <div className="col-label">Android</div>
              <AndroidDevice dark={true}>
                <div data-screen-label={screen + '-android'} style={{ height: '100%' }}>
                  {renderScreen()}
                </div>
              </AndroidDevice>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
